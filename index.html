<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      color: #333;
    }
    header {
      border-bottom: 2px solid #eaeaea;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }
    h1 {
      color: #0969da;
    }
    .card {
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      padding: 1.5rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Project</h1>
    <p>A quick summary of what this repository or website is about.</p>
  </header>

  <main>
    <section class="card">
      <h2>About Me / Project Overview</h2>
      <p>Replace this text with details about your project, portfolio, or documentation.</p>
    </section>
  </main>

</body>
</html>
